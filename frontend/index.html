<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1230" />
  <title>Happy Birthday, Emma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Everything lives inside .device. On a phone it fills the screen; on a
       wide/desktop screen it becomes a centered, phone-shaped column so the
       book renders the same way it does natively on a phone (see styles.css). -->
  <div id="device" class="device">
    <!-- The opening screen IS page 1 (see pages.js). Pages are injected here. -->
    <main id="book" class="book" hidden aria-live="polite"></main>

    <!-- Controls -->
    <button id="prev" class="nav nav-prev" type="button" aria-label="Previous page" hidden>‹</button>
    <button id="next" class="nav nav-next" type="button" aria-label="Next page" hidden>›</button>
    <button id="mute" class="mute" type="button" aria-label="Mute music" hidden>♪</button>
    <div id="progress" class="progress" hidden></div>
  </div>

  <audio id="audio" loop preload="auto"></audio>
  <audio id="ambience" loop preload="auto"></audio>

  <script src="pages.js"></script>
  <script src="app.js"></script>
</body>
</html>
